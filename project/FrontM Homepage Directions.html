<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrontM Homepage, 3 Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  *,*::before,*::after { box-sizing: border-box; margin:0; padding:0; }
  :root { --accent:#34ecf0; --bg:#04070e; --ink:#f3f6fb; --ink-2:#aeb8c9; --ink-3:#6b7689; --line:rgba(255,255,255,0.1); --line-soft:rgba(255,255,255,0.06); --surface:rgba(255,255,255,0.04); }
  html,body { height:100%; }
  body { font-family:"Figtree",system-ui,sans-serif; background:var(--bg); color:var(--ink); overflow:hidden; display:flex; flex-direction:column; }

  /* header */
  header.bar { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px 24px; border-bottom:1px solid var(--line-soft); background:rgba(0,0,0,0.3); backdrop-filter:blur(10px); flex-wrap:wrap; z-index:5; }
  .ttl { display:flex; align-items:center; gap:12px; }
  .ttl .mark { width:24px; height:24px; border-radius:6px; background:conic-gradient(from 200deg,#34ecf0,#4b7bff,#34ecf0); position:relative; }
  .ttl .mark::after { content:""; position:absolute; inset:5px; border-radius:3px; background:var(--bg); }
  .ttl h1 { font-size:1rem; font-weight:600; letter-spacing:-0.01em; }
  .ttl span { font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3); }

  .seg { display:flex; gap:4px; padding:4px; background:var(--surface); border:1px solid var(--line-soft); border-radius:999px; }
  .seg button { font:inherit; font-size:0.85rem; font-weight:500; color:var(--ink-2); padding:7px 15px; border-radius:999px; border:none; background:none; cursor:pointer; transition:all .2s; white-space:nowrap; }
  .seg button:hover { color:var(--ink); }
  .seg button.active { background:var(--ink); color:#04070e; font-weight:600; }
  .seg button .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .seg button[data-k="a"] .dot { background:#2ff0ea; }
  .seg button[data-k="b"] .dot { background:#3b74ff; }
  .seg button[data-k="c"] .dot { background:#34ecf0; }

  /* stage */
  .stage { flex:1; min-height:0; display:grid; gap:1px; background:var(--line-soft); }
  .stage.compare { grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:minmax(0,1fr); }
  .stage.focus { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); }

  .col { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; background:var(--bg); }
  .col.hidden { display:none; }
  .col-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 16px; border-bottom:1px solid var(--line-soft); }
  .col-name { display:flex; align-items:center; gap:9px; font-size:0.9rem; font-weight:600; }
  .col-name .d { width:8px; height:8px; border-radius:50%; }
  .col-name small { font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); font-weight:400; margin-left:2px; }
  .col-a .d { background:#2ff0ea; box-shadow:0 0 8px #2ff0ea; }
  .col-b .d { background:#3b74ff; box-shadow:0 0 8px #3b74ff; }
  .col-c .d { background:#34ecf0; box-shadow:0 0 8px #34ecf0; }
  .open { font-family:"JetBrains Mono",monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-3); border:1px solid var(--line-soft); padding:5px 10px; border-radius:6px; transition:all .2s; text-decoration:none; white-space:nowrap; }
  .open:hover { color:var(--ink); border-color:var(--line); }

  .screen { position:relative; flex:1; min-height:0; overflow:hidden; }
  .screen iframe { border:none; transform-origin:top left; background:var(--bg); }
  .scrollnote { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3); background:rgba(0,0,0,0.5); padding:5px 11px; border-radius:999px; border:1px solid var(--line-soft); pointer-events:none; opacity:0; transition:opacity .4s; backdrop-filter:blur(6px); }
  .screen:hover .scrollnote { opacity:0.7; }

  .hint { font-size:0.82rem; color:var(--ink-3); }
  @media (max-width:980px){ .hint { display:none; } }
</style>
</head>
<body>
  <header class="bar">
    <div class="ttl">
      <span class="mark"></span>
      <h1>FrontM Homepage</h1>
      <span>3 directions</span>
    </div>
    <div class="seg" id="seg">
      <button data-k="all" class="active">Compare all</button>
      <button data-k="a"><span class="dot"></span>Deep Current</button>
      <button data-k="b"><span class="dot"></span>Bridge</button>
      <button data-k="c"><span class="dot"></span>Horizon</button>
    </div>
    <div class="hint">Scroll inside any panel · open ↗ for full size</div>
  </header>

  <div class="stage compare" id="stage">
    <div class="col col-a" data-k="a">
      <div class="col-head">
        <div class="col-name"><span class="d"></span>A · Deep Current <small>lush · cyan</small></div>
        <a class="open" href="directions/Deep Current.html" target="_blank" rel="noopener">Open ↗</a>
      </div>
      <div class="screen"><iframe data-src="directions/Deep Current.html" title="Deep Current" loading="lazy"></iframe><div class="scrollnote">scroll to explore</div></div>
    </div>
    <div class="col col-b" data-k="b">
      <div class="col-head">
        <div class="col-name"><span class="d"></span>B · Bridge <small>sharp · blue</small></div>
        <a class="open" href="directions/Bridge.html" target="_blank" rel="noopener">Open ↗</a>
      </div>
      <div class="screen"><iframe data-src="directions/Bridge.html" title="Bridge" loading="lazy"></iframe><div class="scrollnote">scroll to explore</div></div>
    </div>
    <div class="col col-c" data-k="c">
      <div class="col-head">
        <div class="col-name"><span class="d"></span>C · Horizon <small>spacious · gradient</small></div>
        <a class="open" href="directions/Horizon.html" target="_blank" rel="noopener">Open ↗</a>
      </div>
      <div class="screen"><iframe data-src="directions/Horizon.html" title="Horizon" loading="lazy"></iframe><div class="scrollnote">scroll to explore</div></div>
    </div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const cols = [...document.querySelectorAll('.col')];
  const frames = [...document.querySelectorAll('iframe')];
  const DESIGN_W = 1440;

  // lazy-set src so all three load
  frames.forEach(f => { f.src = f.dataset.src; });

  function sizeFrames(){
    document.querySelectorAll('.col:not(.hidden) .screen').forEach(screen => {
      const f = screen.querySelector('iframe');
      const W = screen.clientWidth, H = screen.clientHeight;
      if (W < 20 || H < 20) return;          // guard against pre-layout 0s
      const scale = W / DESIGN_W;
      if (!isFinite(scale) || scale <= 0) return;
      f.style.width = DESIGN_W + 'px';
      f.style.height = (H / scale) + 'px';
      f.style.transform = 'scale(' + scale + ')';
    });
  }

  function setMode(k){
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('active', b.dataset.k === k));
    if (k === 'all'){
      stage.classList.add('compare'); stage.classList.remove('focus');
      cols.forEach(c => c.classList.remove('hidden'));
    } else {
      stage.classList.remove('compare'); stage.classList.add('focus');
      cols.forEach(c => c.classList.toggle('hidden', c.dataset.k !== k));
    }
    requestAnimationFrame(sizeFrames);
  }

  document.getElementById('seg').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    setMode(btn.dataset.k);
  });

  window.addEventListener('resize', () => requestAnimationFrame(sizeFrames));
  window.addEventListener('load', sizeFrames);
  // initial sizing (and after fonts/layout settle)
  sizeFrames();
  setTimeout(sizeFrames, 300);
  setTimeout(sizeFrames, 1000);
</script>
</body>
</html>
