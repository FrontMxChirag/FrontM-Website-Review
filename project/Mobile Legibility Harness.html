<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrontM · Mobile Legibility Harness</title>
<style>
  body { margin: 0; background: #080A16; color: #B9BFD8; font: 13px/1.5 ui-monospace, monospace; padding: 18px; }
  h1 { font-size: 15px; color: #fff; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #7E86A8; }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .controls button { background: #181D33; color: #EDEFF7; border: 1px solid rgba(255,255,255,0.16); border-radius: 5px; padding: 7px 14px; font: 12px ui-monospace, monospace; cursor: pointer; }
  .controls button:hover { border-color: #9A86FF; }
  .row { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
  .device { display: flex; flex-direction: column; gap: 6px; }
  .device .label { font-size: 11px; color: #7E86A8; }
  .device .label b { color: #fff; }
  .device .ovf { color: #18C95C; }
  .device .ovf.bad { color: #FF6A04; }
  .shell { border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; overflow: hidden; background: #000; }
  iframe { border: 0; display: block; transform-origin: 0 0; }
</style>
</head>
<body>
<h1>Mobile Legibility Harness</h1>
<p>Each frame is a REAL viewport (media queries + JS gates respond to it). Buttons scroll all frames to the same section. Overflow status auto-checks scrollWidth.</p>
<div class="controls">
  <button data-go="top">Hero</button>
  <button data-go="problem-flow">Problem → Solution</button>
  <button data-go="platform">Platform</button>
  <button data-go="bottom">Footer / CTA</button>
  <button data-go="ovf">Re-check overflow</button>
  <button data-go="diag">Run full diagnostics</button>
</div>
<pre id="diag" style="background:#0E1224;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:14px;white-space:pre-wrap;color:#B9BFD8;">diagnostics not run yet — click “Run full diagnostics”</pre>
<div class="row" id="row"></div>

<script>
(function () {
  var SRC = 'FrontM Homepage v2.html';
  var DEVICES = [
    { w: 390,  h: 844,  scale: 0.42, name: '390×844 phone' },
    { w: 430,  h: 932,  scale: 0.42, name: '430×932 phone' },
    { w: 768,  h: 1024, scale: 0.40, name: '768×1024 tablet' },
    { w: 1080, h: 1920, scale: 0.26, name: '1080×1920 portrait' },
    { w: 981,  h: 1200, scale: 0.34, name: '981px breakpoint edge (landscape clock)' }
  ];
  var row = document.getElementById('row'), frames = [];
  DEVICES.forEach(function (d) {
    var dev = document.createElement('div'); dev.className = 'device';
    var lbl = document.createElement('div'); lbl.className = 'label';
    lbl.innerHTML = '<b>' + d.name + '</b> · <span class="ovf">…</span>';
    var shell = document.createElement('div'); shell.className = 'shell';
    shell.style.width = (d.w * d.scale) + 'px'; shell.style.height = (d.h * d.scale) + 'px';
    var f = document.createElement('iframe');
    f.src = SRC; f.width = d.w; f.height = d.h;
    f.style.width = d.w + 'px'; f.style.height = d.h + 'px';
    f.style.transform = 'scale(' + d.scale + ')';
    shell.appendChild(f); dev.appendChild(lbl); dev.appendChild(shell); row.appendChild(dev);
    frames.push({ f: f, lbl: lbl.querySelector('.ovf'), d: d });
  });

  function checkOverflow() {
    frames.forEach(function (fr) {
      try {
        var doc = fr.f.contentDocument;
        var over = doc.documentElement.scrollWidth - doc.documentElement.clientWidth;
        var bad = over > 1;
        var culprit = '';
        if (bad) {
          var els = doc.body.querySelectorAll('*');
          for (var i = 0; i < els.length; i++) {
            var r = els[i].getBoundingClientRect();
            if (r.right - doc.documentElement.clientWidth > 2 && r.width > 40) {
              culprit = els[i].className ? ('.' + String(els[i].className).split(' ')[0]) : els[i].tagName;
              break;
            }
          }
        }
        fr.lbl.textContent = bad ? ('OVERFLOW +' + over + 'px ' + culprit) : 'no overflow ✓';
        fr.lbl.className = 'ovf' + (bad ? ' bad' : '');
      } catch (e) { fr.lbl.textContent = 'frame not ready'; }
    });
  }

  document.querySelector('.controls').addEventListener('click', function (e) {
    var go = e.target.getAttribute('data-go'); if (!go) return;
    if (go === 'ovf') return checkOverflow();
    if (go === 'diag') return runDiag();
    frames.forEach(function (fr) {
      try {
        var w = fr.f.contentWindow, doc = fr.f.contentDocument;
        var y = 0;
        if (go === 'bottom') y = doc.documentElement.scrollHeight;
        else if (go !== 'top') { var el = doc.getElementById(go); if (el) y = el.getBoundingClientRect().top + w.scrollY - 80; }
        w.scrollTo({ top: y, behavior: 'instant' });
      } catch (err) {}
    });
    setTimeout(checkOverflow, 600);
  });

  setTimeout(checkOverflow, 2500);

  function px(v){ return Math.round(parseFloat(v) * 10) / 10; }
  function runDiag() {
    var out = [];
    frames.forEach(function (fr) {
      try {
        var doc = fr.f.contentDocument, win = fr.f.contentWindow;
        var de = doc.documentElement;
        var pflow = doc.getElementById('problem-flow'), plat = doc.getElementById('platform');
        var h1 = doc.querySelector('.hero h1');
        var cta = doc.querySelector('.hero-cta .btn-primary');
        var lede = doc.querySelector('.hero .lede');
        var smallest = 99;
        ['.poc-d', '.pfr-d', '.pf-desc', '.pf-node', '.pf-tile span'].forEach(function (sel) {
          var el = doc.querySelector(sel);
          if (el) smallest = Math.min(smallest, parseFloat(win.getComputedStyle(el).fontSize));
        });
        var over = de.scrollWidth - de.clientWidth;
        var wheel = doc.querySelector('.pflow-wheelwrap .cw-stage');
        var dbg = win.__fmMotion || {};
        out.push(
          '╔═ ' + fr.d.name +
          '\n║ overflow: ' + (over > 1 ? 'FAIL +' + over + 'px' : 'PASS') +
          '\n║ pflow mode: ' + (pflow && pflow.classList.contains('pf-static') ? 'STATIC stack' : 'scroll-scrub') +
          '\n║ platform mode: ' + (plat && plat.classList.contains('pf-static') ? 'STATIC stack' : 'scroll-scrub') +
          '\n║ hero h1: ' + (h1 ? px(win.getComputedStyle(h1).fontSize) + 'px / lh ' + px(win.getComputedStyle(h1).lineHeight) : '?') +
          '\n║ hero lede: ' + (lede ? px(win.getComputedStyle(lede).fontSize) + 'px' : '?') +
          '\n║ smallest body text: ' + (smallest === 99 ? '?' : smallest.toFixed(1) + 'px ' + (smallest >= 12 ? '(≥12 ok)' : 'TOO SMALL')) +
          '\n║ primary CTA: ' + (cta ? Math.round(cta.getBoundingClientRect().width) + '×' + Math.round(cta.getBoundingClientRect().height) + 'px ' + (cta.getBoundingClientRect().height >= 44 ? '(≥44 tap ok)' : 'TAP TARGET SMALL') : 'NOT FOUND') +
          '\n║ wheel width: ' + (wheel ? Math.round(wheel.getBoundingClientRect().width) + 'px (vp ' + fr.d.w + ')' : '?') +
          '\n║ nav height: ' + (doc.getElementById('nav') ? Math.round(doc.getElementById('nav').getBoundingClientRect().height) + 'px' : '?') +
          '\n╚ clocks: pflow ' + (dbg.pflow == null ? 'inert (static)' : dbg.pflow.toFixed(3)) + ' · platform ' + (dbg.platform == null ? 'inert (static)' : dbg.platform.toFixed(3))
        );
      } catch (err) { out.push(fr.d.name + ': frame error ' + err.message); }
    });
    document.getElementById('diag').textContent = out.join('\n\n');
  }
})();
</script>
</body>
</html>
